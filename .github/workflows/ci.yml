name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the real segmentation regression tests (pipeline + K-Means + real assertions on segment output)
        run: python -m unittest tests.test_segmentation -v
      - name: Generate the static preview image + Power BI CSV exports
        run: python viz/dashboard_export.py
